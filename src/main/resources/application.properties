spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/event_manager
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
jwt.secret=ChaveSecretaSuperSeguraParaAssinaturaDoTokenJWT2026TrocarEmProducao
jwt.expiration-ms=86400000

# "Lembrar de mim": 30 dias em vez das 24h padrão
jwt.remember-expiration-ms=2592000000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Spring Mail configuration 
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true